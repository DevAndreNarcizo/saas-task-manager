name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: npm install
      - run: npm run build:web
      - run: cd apps/api && composer install --no-interaction --prefer-dist
      - run: cd apps/api && cp .env.example .env && php artisan key:generate
      - run: npm run test:api
